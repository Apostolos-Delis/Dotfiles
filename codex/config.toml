# Codex CLI Configuration
# Docs: https://developers.openai.com/codex/config-basic/

model = "gpt-5.5"
suppress_unstable_features_warning = true

# Approval policy: "untrusted" | "on-request" | "never"
# - untrusted: ask before everything
# - on-request: let the model decide when approval is needed
# - never: never ask (fully autonomous)
approval_policy = "on-request"

# Sandbox mode: "workspace-write" | "read-only" | "danger-full-access"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
plan_mode_reasoning_effort = "xhigh"

notify = ["/Users/Apostolos.Delis@opendoor.com/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
service_tier = "flex"

[sandbox_workspace_write]
# Network is blocked by default for security
# Enable when needed for npm install, API calls, etc.
network_access = false

[features]
